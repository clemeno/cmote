# Release build — cuts the downloadable, portable binaries for a tagged version
# (PLAN §16, "Release pipeline"). CI (`ci.yml`) keeps `main` green but deliberately
# ships nothing; THIS workflow is the publishing half: on a version tag it builds the
# optimized binary for every supported target, packages each the way its OS expects
# (a bare portable `cmote.exe` on Windows, a Finder-launchable `cmote.app` on macOS —
# universal since §127, so one bundle runs natively on Intel and Apple Silicon),
# checksums them, and attaches the lot to a DRAFT GitHub Release for a human to review
# and publish.
#
# The artifacts are NOT code-signed or notarized, and will not be — Authenticode on
# Windows and `codesign` + notarize on macOS are refused rather than deferred (PLAN §16:
# an ordinary certificate does not silence SmartScreen, which warns on reputation, and a
# signing key in CI is a secret worth more than it saves). So `SHA256SUMS` is THE integrity
# check, not a stand-in for one, and a fresh download trips SmartScreen / Gatekeeper for
# good rather than "until that lands".
name: Release

on:
  # A version tag (bare `MAJOR.MINOR.PATCH`, matching the repo's existing tags —
  # `2.3.0`, not `v2.3.0`) is what publishes a release.
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  # A manual run builds and packages both targets WITHOUT publishing (the release
  # job below is tag-only), so the pipeline can be exercised before a real tag.
  workflow_dispatch:

# Never cancel a release mid-flight; each tag is its own ref, so this only guards
# against a double-trigger on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default to read-only; only the publish job opts up to `contents: write`.
permissions:
  contents: read

jobs:
  # ── The tag and the manifest have to agree (§171) ──────────────────────────
  # A tag is the only thing that NAMES a release; `Cargo.toml` is the only thing the
  # artifacts themselves carry — the file names come from the tag, while the version
  # inside the exe and the bundle's `CFBundleVersion` (`bundle-macos.sh` seds it out of
  # the manifest) come from the tree. Tag `4.0.1` on a tree that still says `4.0.0` and
  # every file is labelled one version while reporting another, with nothing a human
  # reviewing the draft would see.
  #
  # So it is checked first and the builds wait for it: one runner start against finding
  # out ten minutes later, or not at all. Skipped on a manual dry run, where the ref is a
  # branch and there is no version being claimed.
  version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare the tag with the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml $manifest" >&2
            exit 1
          fi
          echo "tag and manifest agree: $manifest"

  # ── Windows portable exe ──────────────────────────────────────────────────
  # windows-latest is our native `x86_64-pc-windows-msvc` target, so a plain
  # release build writes `target/release/cmote.exe` — the portable binary that
  # ships as-is (no installer, no bundle).
  windows:
    name: build (x86_64-pc-windows-msvc)
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--locked` builds strictly from the committed Cargo.lock — a release must
      # be reproducible, and a stale lock should fail the build rather than float.
      - run: cargo build --release --locked
      - name: Stage the exe under its release name
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/cmote.exe \
            "dist/cmote-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  # ── macOS app bundle (universal) ──────────────────────────────────────────
  # ONE bundle that runs natively on both kinds of Mac (PLAN §127). The runners
  # are Apple Silicon, so `aarch64-apple-darwin` builds natively and
  # `x86_64-apple-darwin` cross-compiles exactly as CI has been proving all
  # along; `lipo` then glues the two Mach-Os into one universal binary, and
  # `bundle-macos.sh` wraps THAT in `cmote.app` so Finder launches it as a GUI
  # app rather than opening a Terminal on the bare binary (README, PLAN §11).
  # `ditto` zips the bundle the macOS way, preserving its structure.
  #
  # A universal binary rather than two downloads: the whole choice a user faces
  # here is one they should not have to make, and a Mac that runs the wrong slice
  # under Rosetta is slower for no reason. The cost is one file about twice the
  # size, which for a portable app measured in single-digit megabytes is nothing.
  macos:
    name: build (universal-apple-darwin)
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Fuse the two slices into one universal binary
        shell: bash
        run: |
          mkdir -p target/universal
          lipo -create -output target/universal/cmote \
            target/x86_64-apple-darwin/release/cmote \
            target/aarch64-apple-darwin/release/cmote
          # Fail loudly if either slice went missing: `lipo -create` on one input
          # succeeds and writes a single-architecture file, which would ship as
          # "universal" and work on exactly half the Macs it claims.
          lipo -archs target/universal/cmote | tee /dev/stderr \
            | grep -qw x86_64
          lipo -archs target/universal/cmote | grep -qw arm64
      - name: Wrap the binary in cmote.app and zip it
        shell: bash
        env:
          # Point the bundler at the fused binary — its default is the native
          # `target/release/cmote`, which a --target build does not write.
          BIN: target/universal/cmote
        run: |
          ./bundle-macos.sh
          mkdir -p dist
          ditto -c -k --keepParent target/release/cmote.app \
            "dist/cmote-${GITHUB_REF_NAME}-universal-apple-darwin.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  # ── Publish (tag only) ────────────────────────────────────────────────────
  # Gathers both targets' artifacts, checksums them uniformly on one host, and
  # attaches everything to a DRAFT release. Skipped on a manual dry run — that
  # `if` is what makes workflow_dispatch a build-only exercise.
  release:
    name: draft release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The only job that writes: creating a release needs the token's write scope.
    permissions:
      contents: write
    steps:
      - name: Collect the built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # One SHA-256 per file, computed in one place so the digests are uniform
      # across OSes. Glob only the `cmote-*` payloads so the sums file, written
      # into the same directory, never hashes itself.
      - name: Checksum the artifacts
        run: (cd dist && sha256sum cmote-* > SHA256SUMS)
      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          # Left as a draft: a human reviews the artifacts and clicks Publish, so
          # nothing goes public automatically and a bad tag can be redone silently.
          draft: true
          name: cmote ${{ github.ref_name }}
          # `generate_release_notes` PRE-PENDS this body to the notes GitHub builds from
          # the commit range, so the two compose: the essentials first, the full commit
          # list under them for whoever wants it. That list is long — 4.0.0 is 375 commits
          # — which is exactly why the summary has to lead, and `CHANGELOG.md` is the
          # summary rather than a second one written here.
          #
          # The verification lines are not boilerplate. This workflow's header says
          # `SHA256SUMS` is THE integrity check and not a stand-in for one, and the release
          # page is the only place the person downloading it ever reads. Saying that the
          # warning is expected and permanent is what stops it reading as a bad download.
          body: |
            **[What changed in this release](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)** · [design record](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/PLAN.md)

            Portable: one `cmote.exe` on Windows, one `cmote.app` on macOS (universal — Intel and Apple Silicon in the same bundle). No installer, nothing written outside the folder you put it in.

            ### Verifying your download

            These binaries are **not** code-signed or notarized, and will not be — that is a decision, not something pending (PLAN §16). So `SHA256SUMS` is the integrity check:

            ```sh
            sha256sum -c SHA256SUMS          # Linux, macOS, Git Bash
            ```
            ```powershell
            Get-FileHash .\cmote-*.exe -Algorithm SHA256   # then compare with SHA256SUMS
            ```

            Windows SmartScreen and macOS Gatekeeper will warn about a fresh download and will keep warning. That is expected, it is what an unsigned binary looks like, and it is not a sign that the file is wrong — the checksum is.
          fail_on_unmatched_files: true
          files: |
            dist/cmote-*
            dist/SHA256SUMS
