[package]
name = "cmote"
version = "3.0.0"
edition = "2024"
# MIT, matching the LICENSE file. Declared here too so the crate carries a valid
# SPDX license: `cargo deny check licenses` (CI, PLAN §12) flags any package with
# no license, and that includes our own.
license = "MIT"

[dependencies]
# The VT/ANSI terminal engine (PLAN §9, §16). Replaces `vt100`, whose small subset was
# the compatibility ceiling: alacritty_terminal is a full VT implementation — DEC
# line-drawing charset, scrollback, origin mode, custom tab stops, the rich SGR set
# (dim/italic/strikethrough/conceal, double/curly/dotted/dashed underline + underline
# colour), and it answers host queries (DSR/DA/DECRQM, OSC colour) itself via an
# `EventListener`, which retires our hand-rolled `term::compat` and `term::answer`. Pure
# Rust and Apache-2.0, so it keeps the no-C-toolchain portable build (§12). It bundles a
# tty/event-loop we do not use (we feed bytes off the SSH channel), but that is pure-Rust
# dead weight, not a C dependency.
alacritty_terminal = "0.26"
anyhow = "1.0.104"
# `advanced` unlocks the `Widget` trait, so the terminal grid can be one custom widget
# that draws every cell at an exact pixel position (PLAN §11) instead of a widget per
# cell — the only way a fallback glyph cannot shift the row it is on.
iced = { version = "0.14.0", features = ["advanced"] }
rfd = "0.17.2"
# default-features=false drops russh's default `aws-lc-rs` crypto backend (needs
# a C toolchain + NASM to build). We use `ring` instead: it ships pre-generated
# assembly for x86_64-pc-windows-msvc, so it builds without NASM and keeps the
# portable single-exe goal (PLAN §11). `flate2` = compression, `rsa` = RSA keys.
russh = { version = "0.62.4", default-features = false, features = ["ring", "flate2", "rsa"] }
# The sftp subsystem, used to upload a local file over its own channel (PLAN §17). It
# rides on russh's `ChannelStream`, so it adds a protocol — not a second SSH stack.
russh-sftp = "2.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `fs` = async local file I/O, so streaming an upload never blocks a runtime worker.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "fs", "sync", "macros", "time"] }
vt100 = "0.16.2"
zeroize = "1.9.0"

[dev-dependencies]
# Temporary directories for tests that write known_hosts fixtures (§13).
tempfile = "3"

# Release profile (PLAN §11): a small, fast, self-contained portable exe.
#   lto            — link-time optimization across crates
#   codegen-units  — one unit trades build time for better optimization
#   strip          — drop symbols to shrink the binary
#   panic = abort  — no unwinding: smaller code, and a crash aborts instead of
#                    limping on (acceptable for a GUI app)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
