[package]
name = "cmote"
version = "4.0.0"
edition = "2024"
# MIT, matching the LICENSE file. Declared here too so the crate carries a valid
# SPDX license: `cargo deny check licenses` (CI, PLAN §12) flags any package with
# no license, and that includes our own.
license = "MIT"

[dependencies]
# The encrypted secret vault for opt-in credential persistence (PLAN §16). A saved
# password / key passphrase is kept in `cmote-data/secrets.age`, encrypted with a master
# passphrase the user chooses — so the whole store stays PORTABLE (a USB stick unlocks on any
# OS/machine with the passphrase), unlike a machine-bound OS keyring / DPAPI blob. `age` is the
# modern file-encryption format (scrypt KDF + XChaCha20-Poly1305 AEAD) and the crate is pure
# Rust (RustCrypto primitives, system RNG via `getrandom`) — no C toolchain, so the no-NASM /
# no-C portable build holds (§11). `default-features = false` drops the ASCII-armor / async /
# plugin / ssh extras: the vault is a binary blob decrypted by passphrase, so only the core
# format is needed. Its `secrecy` re-export (`age::secrecy`) carries the master passphrase into
# the API without a plaintext copy lingering.
age = { version = "0.11", default-features = false }
# The VT/ANSI terminal engine (PLAN §9, §16). Replaces `vt100`, whose small subset was
# the compatibility ceiling: alacritty_terminal is a full VT implementation — DEC
# line-drawing charset, scrollback, origin mode, custom tab stops, the rich SGR set
# (dim/italic/strikethrough/conceal, double/curly/dotted/dashed underline + underline
# colour), and it answers host queries (DSR/DA/DECRQM, OSC colour) itself via an
# `EventListener`, which retires our hand-rolled `term::compat` and `term::answer`. Pure
# Rust and Apache-2.0, so it keeps the no-C-toolchain portable build (§12). It bundles a
# tty/event-loop we do not use (we feed bytes off the SSH channel), but that is pure-Rust
# dead weight, not a C dependency.
alacritty_terminal = "0.26"
anyhow = "1.0.104"
# Writes styled HTML to the system clipboard for a rich Ctrl+C (PLAN §10): the terminal grid
# carries per-cell colour and attributes, so a copy can preserve the look when pasted into a
# rich editor, with a plain-text fallback riding alongside for editors (and the shell) that read
# only text. iced's own `clipboard::write` is plain-text only, hence a dedicated backend here.
# `default-features = false` drops the `image-data` feature (and the heavy `image` crate) we do
# not use. Pure Rust on both targets — Windows via `clipboard-win`, macOS via `objc2`, both
# already in the tree through iced — so the no-C-toolchain portable build holds (PLAN §11).
arboard = { version = "3", default-features = false }
# `advanced` unlocks the `Widget` trait, so the terminal grid can be one custom widget
# that draws every cell at an exact pixel position (PLAN §11) instead of a widget per
# cell — the only way a fallback glyph cannot shift the row it is on.
# `image-without-codecs` turns on the renderer's raster-image pipeline, so that same widget can
# composite the inline sixel images a remote program sends (PLAN §41). The `-without-codecs`
# spelling is deliberate: it adds the `image` crate with NO default features, i.e. the pixel-buffer
# types alone and not a single format decoder — cmote decodes sixel itself (`term::sixel`), so a
# PNG/JPEG/GIF decoder would be attack surface (a parser fed bytes straight off the wire) and
# build weight for a format we never hand the renderer. Pure Rust either way, so the
# no-C-toolchain portable build holds (§11).
iced = { version = "0.14.0", features = ["advanced", "image-without-codecs"] }
# Opens an OSC 8 hyperlink in the OS's default browser (PLAN §24). Pure Rust, no C
# toolchain, so the portable build holds (§11). Its default launcher hands the URI to
# PowerShell `Start-Process` as an ENVIRONMENT VARIABLE (data, never shell code), falling
# back to `explorer.exe` with the URI as a single argument — the `cmd /C start` path that
# would let a crafted query string (`?a=1&calc`) inject a command is behind an off-by-
# default `insecure` feature we do not enable. cmote still gates the scheme (`link`) to
# http/https/mailto before handing anything over.
open = "5"
rfd = "0.17.2"
# default-features=false drops russh's default `aws-lc-rs` crypto backend (needs
# a C toolchain + NASM to build). We use `ring` instead: it ships pre-generated
# assembly for x86_64-pc-windows-msvc, so it builds without NASM and keeps the
# portable single-exe goal (PLAN §11). `flate2` = compression, `rsa` = RSA keys.
russh = { version = "0.62.4", default-features = false, features = ["ring", "flate2", "rsa"] }
# The sftp subsystem, used to upload a local file over its own channel (PLAN §17). It
# rides on russh's `ChannelStream`, so it adds a protocol — not a second SSH stack.
russh-sftp = "2.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `fs` = async local file I/O, so streaming an upload never blocks a runtime worker.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "fs", "sync", "macros", "time"] }
# Syntax highlighting for the in-tab editor's CME theme (PLAN §32). `two-face` bundles the large
# Sublime/`bat` syntax set (TypeScript, PHP, TOML, …, far past syntect's own defaults) and re-exports
# the `syntect` it was built against, so the versions never skew. `syntect-default-fancy` selects
# syntect's `fancy-regex` backend — PURE RUST — instead of the default Oniguruma, whose `onig_sys`
# needs a C compiler: that keeps the no-C-toolchain portable build (§11). We build the highlighter by
# hand (`ui/syntax.rs`) rather than via iced's `highlighter` feature, because only a hand-built one can
# carry OUR theme — a `syntect::Theme` assembled from the CME `tokenColors` — instead of a bundled one.
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
zeroize = "1.9.0"

[dev-dependencies]
# Temporary directories for tests that write known_hosts fixtures (§13).
tempfile = "3"

# Release profile (PLAN §11): a small, fast, self-contained portable exe.
#   lto            — link-time optimization across crates
#   codegen-units  — one unit trades build time for better optimization
#   strip          — drop symbols to shrink the binary
#   panic = abort  — no unwinding: smaller code, and a crash aborts instead of
#                    limping on (acceptable for a GUI app)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
