[package]
name = "cmote"
version = "4.0.0"
edition = "2024"
# MIT, matching the LICENSE file. Declared here too so the crate carries a valid
# SPDX license: `cargo deny check licenses` (CI, PLAN §12) flags any package with
# no license, and that includes our own.
license = "MIT"

[dependencies]
# The encrypted secret vault for opt-in credential persistence (PLAN §16). A saved
# password / key passphrase is kept in `cmote-data/secrets.age`, encrypted with a master
# passphrase the user chooses — so the whole store stays PORTABLE (a USB stick unlocks on any
# OS/machine with the passphrase), unlike a machine-bound OS keyring / DPAPI blob. `age` is the
# modern file-encryption format (scrypt KDF + XChaCha20-Poly1305 AEAD) and the crate is pure
# Rust (RustCrypto primitives, system RNG via `getrandom`) — no C toolchain, so the no-NASM /
# no-C portable build holds (§11). `default-features = false` drops the ASCII-armor / async /
# plugin / ssh extras: the vault is a binary blob decrypted by passphrase, so only the core
# format is needed. Its `secrecy` re-export (`age::secrecy`) carries the master passphrase into
# the API without a plaintext copy lingering.
age = { version = "0.11", default-features = false }
# The VT/ANSI terminal engine (PLAN §9, §16). Replaces `vt100`, whose small subset was
# the compatibility ceiling: alacritty_terminal is a full VT implementation — DEC
# line-drawing charset, scrollback, origin mode, custom tab stops, the rich SGR set
# (dim/italic/strikethrough/conceal, double/curly/dotted/dashed underline + underline
# colour), and it answers host queries (DSR/DA/DECRQM, OSC colour) itself via an
# `EventListener`, which retires our hand-rolled `term::compat` and `term::answer`. Pure
# Rust and Apache-2.0, so it keeps the no-C-toolchain portable build (§12). It bundles a
# tty/event-loop we do not use (we feed bytes off the SSH channel), but that is pure-Rust
# dead weight, not a C dependency.
alacritty_terminal = "0.26"
anyhow = "1.0.104"
# Decodes the value of iTerm2's `OSC 1337 ; SetUserVar=name=<base64>` (PLAN §55), which is the only
# base64 cmote reads that a crate does not already handle for it (a known_hosts key blob goes through
# `russh::keys`). It is the SAME crate, at the same version, that `alacritty_terminal` already pulls
# in, so naming it here adds nothing to the dependency graph and nothing to compile — the `image`
# precedent below. Pure Rust, so the no-C-toolchain portable build holds (§11). Taken rather than
# hand-rolled because the input is remote-controlled: a decoder is exactly the kind of small,
# fiddly, boundary-condition-heavy code that should not be written twice in the world.
base64 = "0.22"
# How many columns a character occupies, for the one decision cmote has to make BEFORE the engine
# makes it: whether a glyph still fits before the right margin, or the line has to break first
# (PLAN §102). Every other width question in cmote is answered by reading the grid after the fact,
# where the engine has already marked the wide cells — this one cannot be, because by then the glyph
# is at the wrong columns. Same crate at the same version `alacritty_terminal` already uses for
# exactly this call, so the two can never disagree about where a line breaks, and the dependency
# graph does not grow. The `base64` precedent above.
unicode-width = "0.2"
# Writes styled HTML to the system clipboard for a rich Ctrl+C (PLAN §10): the terminal grid
# carries per-cell colour and attributes, so a copy can preserve the look when pasted into a
# rich editor, with a plain-text fallback riding alongside for editors (and the shell) that read
# only text. iced's own `clipboard::write` is plain-text only, hence a dedicated backend here.
# `default-features = false` drops the `image-data` feature (and the heavy `image` crate) we do
# not use. Pure Rust on both targets — Windows via `clipboard-win`, macOS via `objc2`, both
# already in the tree through iced — so the no-C-toolchain portable build holds (PLAN §11).
arboard = { version = "3", default-features = false }
# `advanced` unlocks the `Widget` trait, so the terminal grid can be one custom widget
# that draws every cell at an exact pixel position (PLAN §11) instead of a widget per
# cell — the only way a fallback glyph cannot shift the row it is on.
# `image-without-codecs` turns on the renderer's raster-image pipeline, so that same widget can
# composite the inline sixel images a remote program sends (PLAN §41). The `-without-codecs`
# spelling is deliberate: it adds the `image` crate with NO default features, i.e. the pixel-buffer
# types alone and not a single format decoder — cmote decodes sixel itself (`term::sixel`), so a
# PNG/JPEG/GIF decoder would be attack surface (a parser fed bytes straight off the wire) and
# build weight for a format we never hand the renderer. Pure Rust either way, so the
# no-C-toolchain portable build holds (§11).
iced = { version = "0.14.0", features = ["advanced", "image-without-codecs"] }
# Decodes a remote picture for the preview tab (PLAN §53). It is the SAME crate iced already pulls
# in above — taken directly here only to turn five formats on, so nothing new enters the dependency
# graph but the codecs themselves, all pure Rust (§11 holds). `ponytail:` these features are not
# split encoder/decoder upstream, so the matching ENCODERS come along and are dead weight in the
# binary: cmote never writes an image file, and the only code that calls them is this module's own
# tests, which build their fixtures rather than carrying binary blobs in the repo.
#
# This deliberately narrows §41's refusal rather than reversing it. That refusal stands where it
# was made: a remote must not get a PNG/JPEG parser run on bytes it PUSHED into the terminal
# stream unasked, so kitty graphics and OSC 1337 are still not implemented. A preview is the other
# case — the user named one file and asked for it — and the decode is fenced accordingly: the
# format is chosen by MAGIC BYTES, never by the remote-controlled file name; `image::Limits` caps
# the dimensions and the allocation, so a declared-30000×30000 decompression bomb is refused
# before a buffer is reserved for it; and the fetch itself is capped in `preview::MAX_SIZE`.
# `default-features = false` keeps that surface to exactly the five formats listed and drops the
# rest (TIFF, AVIF, EXR, DDS, HDR, TGA, PNM, farbfeld, QOI) — every decoder we do not enable is a
# parser that cannot be reached. `rayon` stays off for the same reason it is off everywhere else.
image = { version = "0.25", default-features = false, features = [
	"png",
	"jpeg",
	"gif",
	"bmp",
	"webp",
] }
# Opens an OSC 8 hyperlink in the OS's default browser (PLAN §24). Pure Rust, no C
# toolchain, so the portable build holds (§11). Its default launcher hands the URI to
# PowerShell `Start-Process` as an ENVIRONMENT VARIABLE (data, never shell code), falling
# back to `explorer.exe` with the URI as a single argument — the `cmd /C start` path that
# would let a crafted query string (`?a=1&calc`) inject a command is behind an off-by-
# default `insecure` feature we do not enable. cmote still gates the scheme (`link`) to
# http/https/mailto before handing anything over.
open = "5"
# Decodes the two hand cursors bundled in `assets/` (PLAN §51). They were `const` ASCII art until
# the shapes were judged on screen and found wanting: a cursor is a drawing, and a drawing wants a
# drawing tool. This crate is the smallest way to read one back — pure Rust, its inflate backend
# (`fdeflate` / `miniz_oxide`) already in the tree via `flate2`, so the no-C-toolchain build holds
# (§11). `image` is here too, but iced pulls it in deliberately WITHOUT codecs (§41), so it cannot
# read a PNG and turning its `png` feature on would only add this crate behind another layer.
png = "0.18.1"
rfd = "0.17.2"
# A pseudo-terminal on THIS machine, for the local shells the home screen's Local bar opens
# (PLAN §103). cmote's whole terminal side already speaks to a pty — the remote one SSH asks the
# server for — so a local session needs exactly the same thing without the network: a pty pair, a
# child process on its slave end, and a resize call. On Windows that is ConPTY
# (`CreatePseudoConsole` + a `STARTUPINFOEX` attribute list), on macOS `forkpty`.
#
# Taken rather than hand-rolled, unlike the two Win32 calls `taskbar.rs` declares itself. Those are
# one-shot calls with no lifecycle; a pty is the opposite — the traps are all in the teardown and
# the handle order (a slave handle left open means the reader never sees EOF, so the session never
# ends; closing the ConPTY before the child exits truncates its last output), and they differ per
# platform. §2 says Windows AND macOS, so hand-rolling means TWO backends of that kind. This crate
# is wezterm's, which has run those paths under every Windows build since ConPTY shipped.
#
# Pure Rust, no C toolchain, so the portable build holds (§11). Two costs, both real and both
# accepted rather than argued away. It brings `winapi`, a SECOND Windows-bindings crate beside
# `windows-sys` — the taskbar note above deliberately declared a COM vtable by hand to avoid exactly
# that. And its `serial2` / `winreg` dependencies are NOT optional in 0.9 (`default = []` turns
# nothing off): the crate carries a serial-port pty implementation cmote never opens, so that is
# dead weight in the binary. The trade is taken because what is being avoided is not a binding but a
# protocol, and a pty lifecycle got wrong is a session that never ends or loses its last line.
portable-pty = "0.9"
# default-features=false drops russh's default `aws-lc-rs` crypto backend (needs
# a C toolchain + NASM to build). We use `ring` instead: it ships pre-generated
# assembly for x86_64-pc-windows-msvc, so it builds without NASM and keeps the
# portable single-exe goal (PLAN §11). `flate2` = compression, `rsa` = RSA keys.
russh = { version = "0.62.4", default-features = false, features = ["ring", "flate2", "rsa"] }
# The sftp subsystem, used to upload a local file over its own channel (PLAN §17). It
# rides on russh's `ChannelStream`, so it adds a protocol — not a second SSH stack.
russh-sftp = "2.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `fs` = async local file I/O, so streaming an upload never blocks a runtime worker.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "fs", "sync", "macros", "time"] }
# Syntax highlighting for the in-tab editor's CME theme (PLAN §32). `two-face` bundles the large
# Sublime/`bat` syntax set (TypeScript, PHP, TOML, …, far past syntect's own defaults) and re-exports
# the `syntect` it was built against, so the versions never skew. `syntect-default-fancy` selects
# syntect's `fancy-regex` backend — PURE RUST — instead of the default Oniguruma, whose `onig_sys`
# needs a C compiler: that keeps the no-C-toolchain portable build (§11). We build the highlighter by
# hand (`ui/syntax.rs`) rather than via iced's `highlighter` feature, because only a hand-built one can
# carry OUR theme — a `syntect::Theme` assembled from the CME `tokenColors` — instead of a bundled one.
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
zeroize = "1.9.0"

[target.'cfg(windows)'.dependencies]
# The two Win32 calls behind the tab strip's hand cursors (PLAN §51): a window subclass to answer
# `WM_SETCURSOR` before winit does, and `CreateIconIndirect` to build a cursor from pixels cmote
# draws itself. Needed because Windows ships no hand cursor and iced exposes no custom-cursor seam.
# Bindings only — windows-sys is pure Rust with pre-built import libraries, no C compiler and no
# build script of ours, so the no-C-toolchain portable build holds (§11). The version matches the
# one winit already pulls in, so it is a feature selection on a crate in the tree rather than a new
# dependency to compile.
#
# `Win32_System_Com` was added for the taskbar progress bar (PLAN §54). The taskbar's progress lives on
# `ITaskbarList3`, a COM object, so it needs `CoInitializeEx` + `CoCreateInstance` — and note that this
# crate ships NO COM interfaces at all (it has the `TaskbarList` CLSID and not one method to call on
# it), so `taskbar.rs` declares the interface's IID and vtable itself. That is the trade: ~40 lines of
# hand-written declaration instead of pulling in the full `windows` crate, a second and much larger
# Windows-bindings crate, for two calls.
# Two features were added for the local session (PLAN §103), each for one call.
#
# `Win32_System_Time` — the machine's timezone. A files pane renders every mtime against the zone of
# the machine the files are on (§20), and for a REMOTE that answer comes from a `date +'%z %Z'`
# probe. There is nothing to run here, and std can tell the time but not the offset, so
# `GetTimeZoneInformation` answers it without spawning a shell per session to ask.
#
# `Win32_Storage_FileSystem` — which drives exist, for the file panes' virtual root (`local::path`).
# `GetLogicalDrives` is one bitmask; the alternative is asking whether `A:\` through `Z:\` are
# directories, and two of those 26 questions are the ones that hurt — `A:\` spins up a floppy drive
# and an empty optical drive can block for seconds.
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_Storage_FileSystem",
	"Win32_System_Com",
	"Win32_System_Time",
	"Win32_UI_HiDpi",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Temporary directories for tests that write known_hosts fixtures (§13).
tempfile = "3"

# Release profile (PLAN §11): a small, fast, self-contained portable exe.
#   lto            — link-time optimization across crates
#   codegen-units  — one unit trades build time for better optimization
#   strip          — drop symbols to shrink the binary
#   panic = abort  — no unwinding: smaller code, and a crash aborts instead of
#                    limping on (acceptable for a GUI app)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
